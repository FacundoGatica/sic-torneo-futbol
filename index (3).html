<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture SIC 2026</title>
<style>
:root{
  --bg:#f3f7fa; --card:#ffffff; --ink:#101418; --muted:#5b6770; --line:#dbe5ec;
  --brand:#0d0f12; --brand-ink:#ffffff; --accent:#29a8e0; --chip:#e1f2fb; --chip-ink:#0b5f87;
  --tt:#fff3c4; --tt-ink:#7a5500; --ph:#8793a8; --link:#0b6fa3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0c0f12; --card:#161b20; --ink:#eef3f6; --muted:#9aa8b2; --line:#26303a;
    --brand:#000000; --chip:#14323f; --chip-ink:#8fd4f3; --tt:#4a3a05; --tt-ink:#ffd76a; --ph:#8c9ab5; --link:#6cc6f0; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--brand);color:var(--brand-ink);padding:12px 16px 10px;border-bottom:4px solid var(--accent)}
header .wrap{display:flex;align-items:center;gap:12px;padding:0}
header img{width:46px;height:46px;flex:none}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:#06222f;border-color:var(--accent)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.filters label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.filters select,.filters input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.banner{background:#fff3c4;color:#5a4300;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.aviso{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.aviso a{flex:none;background:var(--accent);color:#06222f;text-decoration:none;font-weight:700;padding:7px 12px;border-radius:999px;font-size:13px}
.day{margin:18px 0 6px;font-size:15px;font-weight:800;color:var(--ink);border-left:4px solid var(--accent);padding-left:8px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:62px 1fr;gap:10px}
.t{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.t small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.teams{font-size:16px;font-weight:600}
.teams .vs{color:var(--muted);font-weight:400;margin:0 4px}
.ph{color:var(--ph);font-style:italic;font-weight:500}
.tt{display:inline-block;background:var(--tt);color:var(--tt-ink);font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:5px;vertical-align:1px}
.meta{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);color:var(--chip-ink);font-size:12px;padding:2px 8px;border-radius:999px}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;color:var(--muted)}
.sum b{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.col h3{margin:4px 0 8px;font-size:14px;color:var(--link)}
.grid{overflow-x:auto;margin-bottom:10px}
.grid table{border-collapse:collapse;min-width:100%;font-size:13px}
.grid th{background:var(--brand);color:#fff;padding:6px 8px;position:sticky;top:0;white-space:nowrap}
.grid td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;background:var(--card);min-width:150px}
.grid td.h{min-width:50px;font-weight:700;background:var(--bg)}
footer{padding:20px 16px 40px;text-align:center;font-size:12px;color:var(--muted)}
button.link{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
@media print{header,.tabs,.filters,footer{display:none}.m{break-inside:avoid}}
</style>
</head>

function parseCSV(t){
  const rows=[]; let r=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){ r.push(f); f=""; }
    else if(c=='\n'){ r.push(f); rows.push(r); r=[]; f=""; }
    else if(c!='\r') f+=c;
  }
  if(f!==""||r.length){ r.push(f); rows.push(r); }
  return rows;
}
function normFecha(s){
  s=String(s).trim(); let m;
  if(m=s.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*$/)){ let y=m[3]?+m[3]:2026; if(y<100)y+=2000; return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; }

  return "";
}
function normHora(s){ s=String(s).trim(); const m=s.match(/^(\d{1,2}):(\d{2})/); return m?`${m[1].padStart(2,"0")}:${m[2]}`:""; }

}
function fmtDia(f){ const [y,m,d]=f.split("-").map(Number); const dt=new Date(y,m-1,d); const s=`${DIAS[dt.getDay()]} ${d} de ${MESES[m-1]}`; return s[0].toUpperCase()+s.slice(1); }
function setBanner(t){ $("#banner").innerHTML = t?`<div class="banner">${t}</div>`:""; }

async function loadAvisos(){
  let list=[];
  if(AVISOS_URL){
    try{
      const res=await fetch(AVISOS_URL+(AVISOS_URL.includes("?")?"&":"?")+"t="+Date.now());
      if(res.ok) list=parseCSV(await res.text()).slice(1).filter(r=>/^(si|sí|x|1|true)$/i.test((r[0]||"").trim())&&r[1]).map(r=>({texto:r[1],link:(r[2]||"").trim(),boton:(r[3]||"").trim()}));
    }catch(e){}
  } else if(!CSV_URL) list=DEMO_AVISOS;
  $("#avisos").innerHTML=list.map(a=>`<div class="aviso"><span>${esc(a.texto)}</span>${a.link&&/^https?:\/\//i.test(a.link)?`<a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.boton||"Ver")}</a>`:""}</div>`).join("");
}
async function load(){
  loadAvisos();
  let rows;
  if(!CSV_URL){ rows = DEMO; setBanner("Estás viendo <b>datos de prueba</b>. Cuando se conecte el Sheet se actualiza solo."); }
  else {
    try{
      const res = await fetch(CSV_URL + (CSV_URL.includes("?")?"&":"?") + "t=" + Date.now());
      if(!res.ok) throw new Error(res.status);
      rows = parseCSV(await res.text()).slice(1);
      setBanner("");
    }catch(e){ rows = []; setBanner("No pude cargar el fixture. Probá actualizar en un rato."); }
  }
  DATA = rows.map(fromRow).filter(x=>x.cat && x.f && x.h);
  DATA.sort((p,q)=> p.f.localeCompare(q.f) || p.h.localeCompare(q.h) || p.sede.localeCompare(q.sede) || (+p.cancha)-(+q.cancha));
  $("#upd").textContent = "Actualizado " + new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  render();
}

const uniq = a => [...new Set(a)];
const isPh = (x,t) => !DATA.some(m => m.cat===x.cat && (m.a===t||m.b===t) && false) && /^(1°|2°|3°|4°|Ganador|Perdedor)/.test(t);
function teamHTML(m){
  const f=(n,tt)=> `<span class="${/^(1°|2°|3°|4°|Ganador|Perdedor)/.test(n)?"ph":""}">${esc(n)}</span>${tt?'<span class="tt" title="Lleva el tercer tiempo">3T</span>':""}`;
  return `${f(m.a,m.ta)}<span class="vs">vs</span>${f(m.b,m.tb)}`;
}
function card(m, opt={}){
  const chips=[];
  if(!opt.noCat) chips.push(m.cat);
  chips.push(`${m.sede} · Cancha ${m.cancha}`);
  if(m.etapa && !/^(regular|fase de grupos)$/i.test(m.etapa)) chips.push(m.etapa);
  if(m.arb) chips.push("Árbitro " + esc(m.arb));
  return `<div class="m"><div class="t">${m.h}</div><div><div class="teams">${teamHTML(m)}</div>
    <div class="meta">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div></div></div>`;
}
function grouped(list, opt){
  if(!list.length) return `<div class="empty">No hay partidos con estos filtros.</div>`;
  let html="", cur="";
  for(const m of list){ if(m.f!==cur){ cur=m.f; html+=`<div class="day">${fmtDia(cur)}</div>`; } html+=card(m,opt); }
  return html;
}
function filtersUI(spec){
  const el=$("#filters"); el.innerHTML="";
  for(const s of spec){
    const d=document.createElement("div");
    d.innerHTML=`<label for="${s.id}">${s.label}</label>`+
      (s.type==="input" ? `<input id="${s.id}" type="search" placeholder="${s.ph||""}" value="${esc(s.value||"")}" list="${s.list||""}" autocomplete="off">`
        : `<select id="${s.id}">${s.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===s.value?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`);
    el.appendChild(d);
    d.firstElementChild.nextElementSibling.addEventListener("input",()=>{ state[s.id]=d.firstElementChild.nextElementSibling.value; render(true); });
  }
}
const state = {fSede:"", fCat:"", fFecha:"", fEq:"", fArb:""};
function opts(first, vals){ return [["",first],...vals.map(v=>[v,v])]; }

function render(keep){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.v===view));
  const sedes=uniq(DATA.map(m=>m.sede)), cats=uniq(DATA.map(m=>m.cat)), fechas=uniq(DATA.map(m=>m.f));
  const fOpts=[["","Todas las fechas"],...fechas.map(f=>[f,fmtDia(f)])];
  const arbs=uniq(DATA.map(m=>m.arb).filter(Boolean)).sort((a,b)=>a-b);
  const focusId = keep && document.activeElement ? document.activeElement.id : null, selStart = keep && document.activeElement && document.activeElement.selectionStart;
  let out="";
  if(view==="equipo"){
    const eq=uniq(DATA.flatMap(m=>[m.a+"|"+m.cat, m.b+"|"+m.cat]).filter(k=>!/^(1°|2°|3°|4°|Ganador|Perdedor)/.test(k))).sort((p,q)=>p.localeCompare(q,"es"));
    filtersUI([
      {id:"fCat",label:"Categoría",opts:opts("Todas",cats),value:state.fCat},
      {id:"fEq",label:"Equipo",type:"input",ph:"Escribí el nombre del equipo",value:state.fEq,list:"dl"},
      ...(arbs.length?[{id:"fArb",label:"Árbitro Nº",opts:opts("Todos",arbs),value:state.fArb}]:[])
    ]);
    const dl=document.getElementById("dl")||Object.assign(document.createElement("datalist"),{id:"dl"}); document.body.appendChild(dl);
    dl.innerHTML=eq.filter(k=>!state.fCat||k.endsWith("|"+state.fCat)).map(k=>`<option value="${esc(k.split("|")[0])}">${esc(k.split("|")[1])}</option>`).join("");
    const q=state.fEq.trim().toLowerCase();
    let list=DATA.filter(m=>(!state.fCat||m.cat===state.fCat)&&(!state.fArb||m.arb===state.fArb)&&(!q||m.a.toLowerCase().includes(q)||m.b.toLowerCase().includes(q)));
    if(!q && !state.fArb) out=`<div class="empty">Escribí el nombre de tu equipo para ver sus partidos.</div>`;
    else{
      let head="";
      if(q){ const names=uniq(list.flatMap(m=>[m.a,m.b]).filter(n=>n.toLowerCase().includes(q))); if(names.length>1) head=`<div class="sum">Hay ${names.length} equipos que coinciden. Afiná la búsqueda o elegí la categoría.</div>`; }
      out=head+grouped(list);
    }
  } else if(view==="cat"){
    filtersUI([
      {id:"fCat",label:"Categoría",opts:opts("Elegí una categoría",cats),value:state.fCat},
      {id:"fFecha",label:"Fecha",opts:fOpts,value:state.fFecha},
      {id:"fEq",label:"Equipo (opcional)",type:"input",ph:"Filtrar por equipo",value:state.fEq}
    ]);
    const q=state.fEq.trim().toLowerCase();
    if(!state.fCat) out=`<div class="empty">Elegí una categoría.</div>`;
    else{
      const list=DATA.filter(m=>m.cat===state.fCat&&(!state.fFecha||m.f===state.fFecha)&&(!q||m.a.toLowerCase().includes(q)||m.b.toLowerCase().includes(q)));
      out=`<div class="sum"><b>${esc(state.fCat)}</b> · ${list.length} partidos</div>`+grouped(list,{noCat:true});
    }
  } else {
    filtersUI([
      {id:"fSede",label:"Sede",opts:opts("Todas",sedes),value:state.fSede},
      {id:"fFecha",label:"Fecha",opts:fOpts,value:state.fFecha||fechas[0]||""},
      ...(arbs.length?[{id:"fArb",label:"Árbitro Nº",opts:opts("Todos",arbs),value:state.fArb}]:[])
    ]);
    const fecha=state.fFecha||fechas[0];
    const list=DATA.filter(m=>m.f===fecha&&(!state.fSede||m.sede===state.fSede)&&(!state.fArb||m.arb===state.fArb));
    if(!list.length) out=`<div class="empty">No hay partidos con estos filtros.</div>`;
    else{
      const cols=uniq(list.map(m=>m.sede+"|"+m.cancha)).sort((a,b)=>{const[x,xn]=a.split("|"),[y,yn]=b.split("|");return x.localeCompare(y)||xn-yn;});
      out=`<div class="day">${fmtDia(fecha)}</div><div class="cols">`+cols.map(c=>{
        const ms=list.filter(m=>m.sede+"|"+m.cancha===c);
        return `<section class="col"><h3>${esc(c.split("|")[0])} · Cancha ${c.split("|")[1]}</h3>`+ms.map(m=>card(m)).join("")+`</section>`;
      }).join("")+`</div>`;
    }
  }
  $("#out").innerHTML=out;
  if(focusId){ const e=document.getElementById(focusId); if(e){ e.focus(); try{ if(selStart!=null) e.setSelectionRange(selStart,selStart);}catch(_){} } }
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{ view=b.dataset.v; state.fEq=""; state.fFecha=""; state.fArb=""; render(); window.scrollTo(0,0); }));
$("#reload").addEventListener("click",load);
load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
